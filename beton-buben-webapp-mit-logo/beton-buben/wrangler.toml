name = "beton-buben"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

# D1-Datenbank-Bindung — die database_id trägst du nach dem Anlegen
# der Datenbank ein (siehe README.md, Schritt 2).
[[d1_databases]]
binding = "DB"
database_name = "beton-buben-db"
database_id = "HIER-DEINE-DATABASE-ID-EINTRAGEN"

# R2-Bucket-Bindung für den Dateien-Reiter (Uploads/Downloads).
# Bucket-Namen frei wählbar, siehe README.md.
[[r2_buckets]]
binding = "FILES"
bucket_name = "beton-buben-dateien"
